name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the CUDA wheels are ~2 GB and useless on CI runners
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log

      # failing output becomes one annotation, visible without downloading logs
      - name: Surface failures
        if: failure()
        run: |
          pip show openai langchain-openai | grep -E "Name|Version" > versions.txt || true
          msg=$(cat versions.txt pytest.log | tail -n 100 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::${msg}"
