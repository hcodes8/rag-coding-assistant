name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the CUDA wheels are ~2 GB and useless on CI runners
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        env:
          # tests mock all LLM calls; the client just requires a non-empty key
          OPENROUTER_API_KEY: dummy-key-for-ci
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log

      - name: Run RAG quality gate
        env:
          DEMO_MODE: "true"
          EMBEDDING_BACKEND: hash
          RERANK_ENABLED: "false"
        run: |
          python -m app.evaluation.runner \
            --dataset evals/demo.jsonl \
            --thresholds evals/thresholds.json \
            --output reports/evaluation.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: reports/evaluation.json
          if-no-files-found: ignore

      # failing output becomes one annotation, visible without downloading logs
      - name: Surface failures
        if: failure()
        run: |
          { pip show openai langchain-openai 2>/dev/null | grep -E "^(Name|Version)"; tail -n 80 pytest.log; } \
            | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::error::{}"
